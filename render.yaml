services:
  - type: web
    name: arohaninfotech-backend
    plan: free
    runtime: node
    buildCommand: "cd Backend && npm install"
    startCommand: "cd Backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
  - type: web
    name: arohaninfotech-frontend
    plan: free
    runtime: node
    buildCommand: "cd Frontend && npm install && npm run build"
    startCommand: "cd Frontend && npm run preview"
    envVars:
      - key: VITE_API_URL
        value: https://arohaninfotech-backend.onrender.com
